<!doctype html>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<link rel="stylesheet" href="popup.css">
<main>
  <header>
    <img class="logo" src="icons/icon-48.png" alt="" width="30" height="30">
    <h1>Ghostfish</h1>
    <span class="pill" id="pill">Off</span>
    <label class="switch-wrap" title="Toggle (Alt+Shift+A)">
      <input type="checkbox" id="toggle" role="switch" aria-label="Enable Ghostfish">
      <span class="switch" aria-hidden="true"></span>
    </label>
  </header>

  <div class="stage" id="stage" data-state="off">
    <div class="bar" id="bar" aria-hidden="true"><i id="bar-fill"></i></div>
    <div class="board-wrap">
      <div class="board" id="board" aria-hidden="true"></div>
      <div class="veil" id="veil"></div>
    </div>
  </div>

  <section class="readout" id="readout" data-state="off">
    <div class="move" id="move" hidden>
      <img id="piece-img" alt="" width="44" height="44">
      <div class="move-main">
        <div class="label">Best move</div>
        <div class="squares"><span id="from"></span><i>→</i><b id="to"></b></div>
        <div class="sub"><span id="piece"></span><em id="note" hidden></em></div>
      </div>
      <div class="eval">
        <div class="label">Eval</div>
        <div class="eval-num" id="eval-num"></div>
        <div class="sub" id="eval-depth"></div>
      </div>
    </div>
    <div class="status" id="status"><i class="dot"></i><span id="text"></span></div>
  </section>

  <footer>
    <span><kbd>⌥</kbd><kbd>⇧</kbd><kbd>A</kbd> toggle</span>
    <span>Stockfish 19 · on-device</span>
  </footer>
</main>
<script src="content/overlay.js"></script>
<script src="popup.js"></script>
